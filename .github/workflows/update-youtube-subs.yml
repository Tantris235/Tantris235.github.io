name: Update YouTube Subs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-subs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update subscriber count
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: Tantris235
          YOUTUBE_CHANNEL_ID: ""
        run: node scripts/update-subs.mjs

      - name: Commit updated subscriber count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs.json
          git diff --staged --quiet || git commit -m "chore: update YouTube subscriber count"
          git push
